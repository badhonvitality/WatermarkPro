<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Diagonal background watermark lines -->
    <line x1="50" y1="450" x2="450" y2="50" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 16" opacity="0.2" />
    <line x1="0" y1="300" x2="300" y2="0" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 16" opacity="0.2" />
    <line x1="200" y1="500" x2="500" y2="200" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 16" opacity="0.2" />
    
    <!-- Central isometric layers symbolizing watermark planes -->
    <path d="M256 90 L420 180 L256 270 L92 180 Z" fill="url(#layerGrad)" />
    <path d="M92 230 L256 320 L420 230 L420 260 L256 350 L92 260 Z" fill="#ffffff" opacity="0.75" />
    <path d="M92 310 L256 400 L420 310 L420 340 L256 430 L92 340 Z" fill="#ffffff" opacity="0.5" />
  </g>
</svg>
